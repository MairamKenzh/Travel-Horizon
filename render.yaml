# Render Blueprint: Render → New → Blueprint → choose this repository.
# Render asks for the values marked "sync: false" while creating the service.
services:
  - type: web
    name: travel-horizon
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/places
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
